<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossing the USA by Rail: A Proof of Concept</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', 'Arial', sans-serif;
            line-height: 1.6;
            color: #1a1a1a;
            background-color: #f8f9fa;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #003e7e 0%, #005eb8 100%);
            color: white;
            padding: 3rem 1rem 2.5rem;
            text-align: center;
            box-shadow: 0 4px 12px rgba(0, 62, 126, 0.2);
            position: relative;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #003e7e 0%, #d31e39 50%, #003e7e 100%);
        }

        header h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        header p {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 0.5px;
            opacity: 0.95;
        }

        /* Container */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2.5rem 1rem;
        }

        /* Blog Post */
        .post {
            background: white;
            margin-bottom: 3rem;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 62, 126, 0.08);
            border: 1px solid #e8eef3;
            transition: all 0.3s ease;
        }

        .post:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0, 62, 126, 0.15);
            border-color: #005eb8;
        }

        .post-header {
            padding: 2rem 2.5rem 1.5rem;
            background: linear-gradient(180deg, #f8f9fa 0%, #ffffff 100%);
            border-bottom: 3px solid #d31e39;
        }

        .post-title {
            font-size: 2.2rem;
            color: #003e7e;
            margin-bottom: 0.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .post-date {
            color: #6c757d;
            font-size: 0.95rem;
            font-family: 'Helvetica Neue', 'Arial', sans-serif;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .post-images {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1rem;
            padding: 1.5rem 2.5rem;
            background-color: #fafbfc;
        }

        .image-container {
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0, 62, 126, 0.1);
            transition: all 0.3s ease;
        }

        .image-container:hover {
            box-shadow: 0 4px 12px rgba(0, 62, 126, 0.2);
            transform: translateY(-2px);
        }

        .post-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .image-container:hover .post-image {
            transform: scale(1.03);
        }

        .image-caption {
            font-size: 0.85rem;
            color: #495057;
            font-family: 'Helvetica Neue', 'Arial', sans-serif;
            padding: 0.6rem 0.8rem;
            text-align: center;
            line-height: 1.4;
            background-color: #f8f9fa;
            border-top: 2px solid #e8eef3;
        }

        .post-content {
            padding: 2rem 2.5rem 2.5rem;
            font-size: 1.05rem;
            color: #2c3e50;
            line-height: 1.8;
        }

        .post-content p {
            margin-bottom: 1.2rem;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 3rem 2rem;
            color: #6c757d;
            font-size: 0.9rem;
            background: linear-gradient(180deg, #f8f9fa 0%, #e8eef3 100%);
            border-top: 3px solid #003e7e;
            margin-top: 2rem;
        }

        footer p {
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }

            header p {
                font-size: 1rem;
            }

            .post-title {
                font-size: 1.6rem;
            }

            .post-header {
                padding: 1.5rem 1.5rem 1rem;
            }

            .post-images {
                grid-template-columns: 1fr;
                padding: 1rem 1.5rem;
            }

            .post-content {
                padding: 1.5rem;
            }

            .post-image {
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Crossing the USA by Rail: A Proof of Concept</h1>
        <p>Can it be done? So it would seem.</p>
    </header>

    <div class="container" id="posts-container">
        <!-- Posts will be loaded here dynamically -->
    </div>

    <footer>
        <p>&copy; 2025 Gordon Wallace</p>
    </footer>

    <script>
        // Load posts from posts.json and text files
        async function loadPosts() {
            try {
                // Fetch the posts configuration
                const response = await fetch('posts.json');
                const posts = await response.json();
                
                const container = document.getElementById('posts-container');
                
                // Load each post
                for (const post of posts) {
                    // Fetch the text content
                    const textResponse = await fetch(post.textFile);
                    const textContent = await textResponse.text();
                    
                    // Create the post HTML
                    const article = document.createElement('article');
                    article.className = 'post';
                    
                    // Build images HTML
                    let imagesHTML = '';
                    if (post.images && post.images.length > 0) {
                        imagesHTML = '<div class="post-images">';
                        for (const image of post.images) {
                            imagesHTML += `
                                <div class="image-container">
                                    <img src="${image.src}" class="post-image" alt="${image.caption || ''}">
                                    <p class="image-caption">${image.caption || ''}</p>
                                </div>
                            `;
                        }
                        imagesHTML += '</div>';
                    }
                    
                    // Split text content into paragraphs (split by double newlines or single newlines)
                    const paragraphs = textContent.trim().split(/\n\n+/).filter(p => p.trim());
                    let contentHTML = '<div class="post-content">';
                    for (const paragraph of paragraphs) {
                        contentHTML += `<p>${paragraph.trim()}</p>`;
                    }
                    contentHTML += '</div>';
                    
                    // Assemble the complete post
                    article.innerHTML = `
                        <div class="post-header">
                            <h2 class="post-title">${post.title}</h2>
                            <p class="post-date">${post.date}</p>
                        </div>
                        ${imagesHTML}
                        ${contentHTML}
                    `;
                    
                    container.appendChild(article);
                }
            } catch (error) {
                console.error('Error loading posts:', error);
                document.getElementById('posts-container').innerHTML = 
                    '<p style="text-align: center; color: #d31e39;">Error loading posts. Please try again later.</p>';
            }
        }
        
        // Load posts when page loads
        document.addEventListener('DOMContentLoaded', loadPosts);
    </script>
</body>
</html>
